<style>
:root{--b:157,92,255;--v:255,79,184;--hi:255,217,138;--tx:#f5efff;--mt:#a093bd;--gd:#ffd76a;--bad:#ff5c7a;--ok:#6ef0b5;--bg:#08050e;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:radial-gradient(1000px 520px at 12% -12%,rgba(var(--b),.2),transparent 62%),radial-gradient(900px 480px at 100% 0%,rgba(var(--v),.12),transparent 60%),var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(var(--b),.04) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--b),.04) 1px,transparent 1px);background-size:44px 44px;z-index:0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:rgba(3,5,14,.75);border:1px solid rgba(var(--b),.28);border-radius:8px;padding:10px 12px;width:100%;min-width:0}

.app{position:relative;z-index:1;display:grid;grid-template-columns:230px 1fr;min-height:100vh}

.logo{font-weight:900;letter-spacing:.3em;font-size:16px;padding-left:10px;color:rgb(var(--hi))}

.sys{position:relative;background:linear-gradient(180deg,rgba(30,14,48,.8),rgba(10,6,18,.9));border:1px solid rgba(var(--b),.32);padding:18px 20px;clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px)}
.sys-h{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:rgb(var(--hi));margin:0 0 14px}
.sys-h::before{content:"◆";color:rgb(var(--v))}
.sys-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(var(--b),.55),transparent)}
h1{font-size:28px;margin:0;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgb(var(--v))}
.mt{color:var(--mt);font-size:13px}
.ok{color:var(--ok)}.warn{color:var(--gd)}.bad{color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
label{display:block;font-size:12px;color:var(--mt);margin:14px 0 6px;letter-spacing:.04em}
.big{font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:8px;background:rgba(var(--b),.12);border:1px solid rgba(var(--b),.22);overflow:hidden;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,rgb(var(--b)),rgb(var(--v)));transition:width .6s}
.ex{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-top:1px solid rgba(var(--b),.16)}
.tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border:1px solid rgba(var(--b),.35);color:rgb(var(--hi));background:rgba(var(--b),.08)}
.hex{width:62px;height:70px;display:grid;place-items:center;font-weight:900;font-size:24px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,var(--c),#120820);color:#fff;flex:none}
.hex.lg{width:84px;height:94px;font-size:36px}
.fig{width:100%;max-width:120px;height:auto;background:rgba(var(--b),.06);border:1px solid rgba(var(--b),.25);flex:none}
.fig.big{max-width:190px}
.fig polyline,.fig line{fill:none;stroke:rgb(var(--hi));stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.fig .gl{stroke:rgba(var(--b),.45);stroke-width:2}
.fig .hd{fill:rgb(var(--hi));stroke:none}
.big-name{font-size:24px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;margin:4px 0 6px}
.cue{color:var(--mt);font-size:14px;margin:8px 0}
.hint{font-size:13px;color:var(--gd);margin:0 0 14px}
.presc{font-size:13px;color:var(--mt)}
.presc b{font-size:20px;color:var(--tx);margin:0 2px}
.dots{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dots i{width:10px;height:10px;transform:rotate(45deg);border:1px solid rgb(var(--b));background:rgba(var(--b),.15)}
.dots .mt{margin-left:8px}
.segs{display:flex;gap:6px}

.segs i.done{background:rgb(var(--b))}
.segs i.cur{background:rgb(var(--hi));opacity:.7}
.rest-box{display:flex;justify-content:space-between;align-items:flex-end;background:rgba(var(--b),.07);border:1px solid rgba(var(--b),.22);padding:14px 16px;margin-bottom:8px}
.rest-n{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;color:rgb(var(--hi))}
.set{display:grid;grid-template-columns:30px 1fr 1fr auto;gap:10px;align-items:end;padding:12px 0;border-top:1px solid rgba(var(--b),.16)}
.set .f{margin:0}
.set-n{align-self:center;font-weight:800;color:var(--mt)}
.set.is-done{opacity:.5}
.set input{text-align:center;font-weight:700}
.run-bar{display:flex;gap:8px;flex-wrap:wrap;position:sticky;bottom:12px;padding:12px 0;z-index:5;background:linear-gradient(180deg,transparent,var(--bg) 30%)}
.run-bar .btn.pri{margin-left:auto}
.big-btn{width:100%;padding:16px;text-align:center}
.warm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--mt);font-size:14px;padding:10px 14px;border:1px dashed rgba(var(--b),.35);margin-bottom:18px}
.plan{display:grid;gap:12px}
.ex-card{display:flex;gap:16px;padding:16px 18px;align-items:center}
.ex-body{flex:1;min-width:0}
.ex-name{font-size:18px;font-weight:750}
.bar.thin{height:6px}
.rec-cover{height:86px;display:grid;place-items:center;font-size:44px;background:linear-gradient(135deg,rgba(var(--b),.28),rgba(var(--v),.16));margin:-18px -20px 14px;clip-path:polygon(16px 0,100% 0,100% 100%,0 100%,0 16px)}
.rec{display:flex;flex-direction:column}
details summary{list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+ ";color:rgb(var(--v))}
details[open] summary::before{content:"− "}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:60;min-width:260px;max-width:92vw;background:linear-gradient(180deg,rgba(34,16,56,.97),rgba(10,6,18,.97));border:1px solid rgb(var(--b));padding:12px 18px;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);font-size:14px}
.toast b{display:block;font-size:11px;letter-spacing:.2em;color:rgb(var(--hi));margin-bottom:2px}
.ov{position:fixed;inset:0;background:rgba(2,3,10,.8);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.sheet{width:min(520px,100%);max-height:90vh;overflow:auto}
.lvlup{position:fixed;inset:0;z-index:70;display:grid;place-items:center;pointer-events:none;background:radial-gradient(circle,rgba(var(--v),.3),transparent 60%);animation:fade 1.9s ease forwards}
.lvlup div{font-size:44px;font-weight:900;letter-spacing:.2em;color:rgb(var(--hi))}
@keyframes fade{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}
.log{max-height:52vh;min-height:240px;overflow:auto;padding:6px 2px}
.msg{margin-bottom:12px;max-width:88%}
.msg.u{margin-left:auto;text-align:right}
.who{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mt);margin-bottom:4px}
.bub{display:inline-block;text-align:left;white-space:pre-wrap;padding:12px 14px;border:1px solid rgba(var(--b),.3);background:rgba(18,10,32,.85);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.msg.u .bub{background:rgba(var(--b),.22);border-color:rgba(var(--b),.55)}
.pulse{animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{opacity:.45}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes shine{0%{transform:translateX(-120%)}100%{transform:translateX(330%)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes aurora{0%{transform:translate(0,0) scale(1)}50%{transform:translate(4%,-3%) scale(1.08)}100%{transform:translate(0,0) scale(1)}}
@keyframes confall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes scanmv{0%{top:-15%}100%{top:115%}}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes gradshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes glitch{0%,91%,100%{transform:none;text-shadow:none}92%{transform:translate(-2px,1px);text-shadow:2px 0 rgb(var(--v)),-2px 0 rgb(var(--hi))}94%{transform:translate(2px,-1px);text-shadow:-2px 0 rgb(var(--v)),2px 0 rgb(var(--hi))}96%{transform:none;text-shadow:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-14px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes hotpulse{0%,100%{text-shadow:0 0 0 transparent}50%{text-shadow:0 0 18px rgb(var(--v))}}
@keyframes ringin{from{stroke-dasharray:0 400}}
@keyframes floatup{0%{transform:translateY(0);opacity:0}10%{opacity:.85}90%{opacity:.4}100%{transform:translateY(-105vh);opacity:0}}
body::after{content:'';position:fixed;inset:-20%;pointer-events:none;z-index:0;background:radial-gradient(40% 35% at 18% 28%,rgba(var(--b),.24),transparent 70%),radial-gradient(35% 30% at 82% 72%,rgba(var(--v),.17),transparent 70%),radial-gradient(28% 24% at 62% 18%,rgba(var(--hi),.1),transparent 70%);animation:aurora 22s ease-in-out infinite}
#fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}

#fx .pt{position:absolute;bottom:-12px;border-radius:50%;background:rgb(var(--hi));box-shadow:0 0 8px rgb(var(--hi));opacity:0;animation:floatup linear infinite}
.conf{position:fixed;inset:0;pointer-events:none;z-index:65;overflow:hidden}
.conf i{position:absolute;top:-14px;width:9px;height:14px;animation:confall linear forwards}
.logo{animation:glitch 7s infinite}
.hex{position:relative;isolation:isolate;animation:floaty 5s ease-in-out infinite}
.hex::before{content:'';position:absolute;inset:-4px;z-index:-1;background:conic-gradient(rgb(var(--v)),rgb(var(--hi)),rgb(var(--b)),rgb(var(--v)));clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);animation:spin 6s linear infinite}
.bar i{position:relative;overflow:hidden}

.btn{transition:transform .2s,background .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px -10px rgba(var(--v),.8)}
.btn.pri{background-size:200% 200%;animation:gradshift 5s ease infinite}
.chip.on{animation:pop .35s ease}
.sys{transition:transform .3s,border-color .3s,box-shadow .3s}

#view[data-enter='1'] .sys{animation:rise .6s cubic-bezier(.2,.7,.2,1) backwards}

.toast{animation:toastIn .45s cubic-bezier(.2,.8,.2,1) backwards}
.rest-n.hot{animation:hotpulse 1s ease-in-out infinite}
.typing i{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:rgb(var(--hi));animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
.lvlup div{animation:pop .6s ease}
.set.is-done .btn{animation:pop .4s ease}
.orb{width:76px;height:76px;margin:0 auto 14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgb(var(--hi)),rgb(var(--v)) 48%,rgb(var(--b)) 85%);box-shadow:0 0 30px -4px rgba(var(--v),.6);animation:breathe 3.4s ease-in-out infinite}

@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes listenpulse{0%,100%{transform:scale(.94)}50%{transform:scale(1.14)}}
@keyframes speakwave{from{transform:scale(.96);box-shadow:0 0 20px -2px rgba(var(--hi),.6)}to{transform:scale(1.1);box-shadow:0 0 50px 4px rgba(var(--hi),.8)}}

.onb .app{grid-template-columns:1fr}
.onb aside,.onb .tabbar{display:none!important}
@media (max-width:820px){
.app{grid-template-columns:1fr}
aside{display:none}
main{padding:18px 14px 120px}
.tabbar{display:flex;flex-direction:row;position:fixed;bottom:0;left:0;right:0;background:rgba(3,5,12,.96);border-top:1px solid rgba(var(--b),.25);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
.tabbar button{flex:1;font-size:10px;padding:8px 0;letter-spacing:.02em;text-align:center}
.tabbar button.on{color:rgb(var(--hi))}
.toast{top:10px}
.run-bar{bottom:84px}
.ex-card{flex-direction:column;align-items:stretch}
.fig{max-width:100%}
}
</style>

function makeBackendSample(){
 const fail=(code,message)=>Object.assign(new Error(message),{code,message,text:message});
 const toB64=b=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=()=>rej(fail('image_rejected','No pude leer la imagen.'));fr.readAsDataURL(b)});
 async function run(input,opts={},asJson=false){
  const msgs=typeof input==='string'?[{role:'user',content:input}]:input;
  const imgs=[];
  for(const b of [].concat(opts.images||[]))imgs.push({mime:b.type,data:await toB64(b)});
  let r;
  try{r=await fetch(BACKEND,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs,images:imgs,json:asJson}),signal:opts.signal})}
  catch(e){throw e.name==='AbortError'?fail('cancelled',''):fail('network','No pude conectarme con el servidor de IA. Revisá tu conexión.')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw fail(j.code||'upstream',j.message||'La IA no respondió. Probá de nuevo.');
  return String(j.text||'');
 }
 const sample=async(input,opts)=>({text:await run(input,opts,false),truncated:false});
 sample.json=async(input,opts)=>{const t=await run(input,opts,true);try{return JSON.parse(t.replace(/```json|```/g,'').trim())}catch(e){throw fail('invalid_json','La respuesta no tuvo el formato esperado.')}};
 sample.limits=async()=>({maxPromptBytes:262144,images:{maxCount:1,maxInputBytes:20000000,mediaTypes:['image/jpeg','image/png','image/webp','image/gif']}});
 return sample;
}

/* ---------- Nutrición ---------- */
const mac=it=>it.per.map(v=>v*it.g/100);
const sum=items=>items.reduce((a,it)=>mac(it).map((v,i)=>a[i]+v),[0,0,0,0]);
function dayTot(date){const r=[0,0,0,0];S.meals.filter(m=>m.date===date).forEach(m=>sum(m.items).forEach((v,i)=>r[i]+=v));return{kcal:Math.round(r[0]),p:r1(r[1]),c:r1(r[2]),f:r1(r[3])}}
function calc(p){
 const a=+p.age,w=+p.kg,h=+p.cm;
 const bmr=10*w+6.25*h-5*a+({h:5,m:-161}[p.sex]??-78);
 const tdee=bmr*({sed:1.2,lig:1.375,mod:1.55,alta:1.725}[p.act]||1.2);
 let k=tdee,note='';
 if(a<18)note='Sos menor de 18: no calculamos déficit. Te sugerimos mantenimiento y acompañamiento profesional.';
 else{if(p.goal==='grasa')k=tdee*.85;if(p.goal==='musc')k=tdee*1.08;k=Math.max(1400,k)}
 k=Math.round(k/10)*10;
 const pr=Math.round(w*(['grasa','musc','fuerza','recomp'].includes(p.goal)?1.8:1.6));
 const f=Math.round(k*.25/9);
 const c=Math.max(50,Math.round((k-pr*4-f*9)/4));
 return{kcal:k,p:pr,c,f,note};
}

 const p=S.profile,inj=p.inj||[],home=p.place==='casa',ck=S.checks[today()];
 const seq=SEQ[Math.min(6,Math.max(2,+p.days||3))],tp=TPL[seq[i%seq.length]];
 const tired=ck&&(ck.sleep<6||ck.energy<=4),hard=S.last&&S.last.diff>=8;
 const [base,reps,rc,ri]=GOAL[p.goal]||GOAL.salud;
 let sets=base+(p.exp==='avanzado'?1:0)-(p.exp==='principiante'?1:0);
 if(tired||hard)sets--;
 sets=Math.max(2,Math.min(5,sets));
 const used=new Set(),ok=k=>(!home||EX[k][2])&&!(EX[k][3]&&inj.includes(EX[k][3]))&&!used.has(k);
 const ex=[];
 for(const s of tp.s){const k=POOL[s].find(ok);if(!k)continue;used.add(k);const e=EX[k];ex.push({k,slot:s,n:e[0],g:e[1],sets,reps,rest:e[4]?rc:ri})}
 const notes=[];
 if(tired)notes.push('Dormiste poco o tenés poca energía: hoy hacés una serie menos por ejercicio.');
 else if(hard)notes.push('Tu última sesión fue muy exigente: hoy la carga es más liviana.');
 if(ck?.pain||S.last?.pain)notes.push('Registraste una molestia. Si duele, cambiá el ejercicio o consultá con un profesional.');
 return{name:tp.n,ex,notes,warm:'5 min de cardio suave + 1 serie liviana del primer ejercicio'};
}
function lastFor(n){for(let i=S.sessions.length-1;i>=0;i--){const j=S.sessions[i].ex.indexOf(n);if(j>=0)return S.sessions[i].sets[j]}return null}
function hint(e){
 const sets=lastFor(e.n);
 if(!sets)return 'Primera vez con este ejercicio: elegí un peso con el que termines todas las reps con buena técnica.';
 const d=sets.filter(s=>s.d);
 if(!d.length)return 'La última vez no completaste series de este ejercicio.';
 const kg=Math.max(...d.map(s=>+s.kg||0)),top=+e.reps.split('-').pop();
 if(kg>0&&d.every(s=>+s.r>=top))return `Última vez: ${kg} kg y cumpliste el rango completo. Si la técnica se mantiene, probá ${r1(kg+2.5)} kg.`;
 return `Última vez: ${kg>0?kg+' kg':'peso corporal'}. Repetí la carga y apuntá a sumar reps antes de subir peso.`;
}

<div style="margin-top:20px"><button class="btn pri big-btn" data-a="start" style="width:100%">Iniciar sesión</button></div>`;
 }

 if(!e)return head+`<section class="sys" style="text-align:center;padding:30px 20px"><div class="ok big-name" style="font-size:28px">Sesión completada</div><p class="mt">Terminaste todos los ejercicios. Cerrá la sesión para guardarla y sumar XP.</p><button class="btn pri big-btn" data-a="finish" style="margin-top:14px">Terminar sesión</button></section>`;
 const sets=a.sets[a.i],rem=Math.max(0,Math.ceil((S.rest-Date.now())/1000));

function fld([k,l,t,o]){
 const v=OBD[k]??'';

 if(t==='num')return `<label for="f_${k}">${l}</label><input id="f_${k}" name="${k}" type="number" inputmode="decimal" step="any" value="${esc(v)}">`;
 if(t==='sel')return `<label for="f_${k}">${l}</label><select id="f_${k}" name="${k}"><option value="" ${v===''?'selected':''} disabled>Elegí una opción</option>${o.map(x=>{const[a,b]=x.split(':');return `<option value="${a}" ${v==a?'selected':''}>${b||a}</option>`}).join('')}</select>`;
 return `<label>${l}</label><div class="chips">${o.map(x=>{const[a,b]=x.split(':');return `<label class="chip"><input type="checkbox" name="${k}" value="${a}" ${v.includes(a)?'checked':''}>${b||a}</label>`}).join('')}</div>`;
}
function readStep(){OBS[OB].f.forEach(([k,,t])=>{OBD[k]=t==='chk'?[...document.querySelectorAll(`input[name="${k}"]:checked`)].map(x=>x.value):($(`[name="${k}"]`)?.value??'').trim()})}
function obErr(){const o=OBD;
 if(OB===0){if(!o.name)return'Decime cómo te llamás.';if(!(o.age>=10&&o.age<=99))return'La edad tiene que estar entre 10 y 99 años.';if(!(o.cm>=120&&o.cm<=230))return'La altura tiene que estar entre 120 y 230 cm.';if(!(o.kg>=30&&o.kg<=300))return'El peso tiene que estar entre 30 y 300 kg.';if(!o.sex)return'Elegí una opción de sexo (podés elegir "Prefiero no decir").'}
 if(OB===1&&['goal','exp','days','mins','place','act','sleep'].some(k=>!o[k]))return'Completá las opciones de entrenamiento para armar tu plan.';
 if(OB===2&&['diet','cook','tono'].some(k=>!o[k]))return'Elegí tus restricciones, tu tiempo para cocinar y cómo querés que te hable.';
 return'';
}

 if(!lim?.images)return say(false,'Este entorno no permite enviar fotos a la IA. Cargá los alimentos a mano.');

 d.busy=1;d.ai={ok:true,m:'Analizando la foto… puede tardar hasta un minuto.'};save();render();
 try{
  const j=await SAMPLE.json(PHOTO_PROMPT,{images:[photoBlob],cache:false});

 });

}

 case 'save':return saveDraft();
 case 'cancelDraft':S.draft=null;big=null;photoBlob=null;return changed();
 case 'editMeal':{const m=S.meals.find(x=>x.id===b.dataset.id);if(!m)return;S.draft={id:m.id,type:m.type,items:JSON.parse(JSON.stringify(m.items)),photo:m.photo,ai:null,editing:true,busy:0};photoBlob=null;V='comidas';FSUB='hoy';return changed()}
 case 'askDel':pendingDel=b.dataset.id;return render();
 case 'cancelDel':pendingDel=null;return render();
 case 'delMeal':S.meals=S.meals.filter(m=>m.id!==b.dataset.id);pendingDel=null;return changed();
 case 'logw':{const v=+$('#wk').value;if(!(v>20&&v<400))return toast('Ingresá un peso válido en kg');S.weights.push({d:today(),kg:v});return changed()}
 case 'mic':return listen();
 case 'tts':S.tts=!S.tts;if(!S.tts&&window.speechSynthesis)speechSynthesis.cancel();save();return render();
 case 'shut':if(window.speechSynthesis)speechSynthesis.cancel();SPEAKING=false;return orbUpd();
 case 'send':return send();
 case 'stop':return ctl?.abort();
 case 'clearChat':S.chat=[];return changed();
 case 'wipeAsk':wipeArmed=true;return render();
 case 'cancelWipe':wipeArmed=false;return render();
 case 'wipe':S=blank();wipeArmed=false;OBD={};OB=0;V='inicio';LV0=null;save();return render();
 }
}
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');
 if(g){V=g.dataset.go;return render()}
 const b=e.target.closest('[data-a]');
 if(b&&!b.disabled)act(b.dataset.a,b);
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.i!==undefined&&S.draft){S.draft.items[+t.dataset.i].g=+t.value||0;return changed()}
 if(t.dataset.f==='type'&&S.draft){S.draft.type=t.value;return save()}
 if(t.dataset.f==='notes'&&S.active){S.active.notes=t.value;return save()}
 if(t.dataset.f==='ctx'){S.shareCtx=t.checked;return save()}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.set!==undefined&&S.active){S.active.sets[S.active.i][+t.dataset.set][t.dataset.f]=t.value;save()}
});
setInterval(()=>{const el=$('#rest');if(el&&S.rest){const r=Math.ceil((S.rest-Date.now())/1000);el.textContent=r>0?r+' s':'Listo';el.classList.toggle('hot',r>0&&r<=5)}},1000);
function enterFx(){document.querySelectorAll('#view .sys').forEach((el,i)=>{el.style.animationDelay=Math.min(i,14)*55+'ms'});document.querySelectorAll('#view [data-count]').forEach(el=>{const to=+el.dataset.count,t0=performance.now(),st=t=>{const k=Math.min(1,(t-t0)/900),e=1-Math.pow(1-k,3);el.textContent=Math.round(to*e);if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st)})}
function confetti(n=70){const cs=['rgb(var(--b))','rgb(var(--v))','rgb(var(--hi))','#6ef0b5'],box=document.createElement('div');box.className='conf';for(let i=0;i<n;i++){const p=document.createElement('i');p.style.left=(Math.random()*100)+'vw';p.style.background=cs[i%cs.length];p.style.animationDelay=(Math.random()*.4)+'s';p.style.animationDuration=(1.8+Math.random()*1.4)+'s';p.style.transform='rotate('+(Math.random()*360)+'deg)';box.appendChild(p)}document.body.appendChild(box);setTimeout(()=>box.remove(),3800)}
for(let i=0;i<24;i++){const p=document.createElement('i');p.className='pt';const z=2+Math.random()*3;p.style.cssText=`left:${Math.random()*100}%;width:${z}px;height:${z}px;animation-duration:${9+Math.random()*12}s;animation-delay:${-Math.random()*16}s`;$('#fx').appendChild(p)}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
let REC=null,LISTEN=false,SPEAKING=false,BUF='';
function orbUpd(){const o=$('.orb');if(o){o.classList.toggle('listen',LISTEN);o.classList.toggle('speak',SPEAKING)}}
function listen(){
 if(!SR)return toast('Tu navegador no tiene dictado por voz. Escribí tu mensaje.');
 if(LISTEN){try{REC.stop()}catch(e){}return}
 try{REC=new SR()}catch(e){return toast('No pude iniciar el micrófono.')}
 REC.lang='es-AR';REC.interimResults=true;REC.continuous=false;BUF='';
 REC.onresult=e=>{let fin='',it='';for(const r of e.results){if(r.isFinal)fin+=r[0].transcript;else it+=r[0].transcript}BUF=(fin+' '+it).trim();const ta=$('#ci');if(ta)ta.value=BUF};
 REC.onerror=e=>toast({'not-allowed':'El navegador bloqueó el micrófono en esta vista. Abrí la página en una pestaña nueva de claude.ai, permitilo en el candado de la barra de direcciones y recargá. Mientras tanto podés dictar con el micrófono del teclado.','service-not-allowed':'El dictado no está disponible en este navegador. Escribí tu mensaje.','no-speech':'No te escuché. Probá de nuevo.','audio-capture':'No encontré un micrófono.'}[e.error]||'No pude escucharte. Probá de nuevo o escribí tu mensaje.');
 REC.onend=()=>{LISTEN=false;const t=BUF.trim();BUF='';const ta=$('#ci');if(t&&ta&&!busy){ta.value=t;send()}else render()};
 LISTEN=true;try{REC.start()}catch(e){LISTEN=false;return toast('El micrófono no se pudo activar.')}
 render();
}
function speak(t){
 if(!S.tts||!window.speechSynthesis||!t)return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t.replace(/[*#_]/g,' '));
 u.lang='es-AR';const v=speechSynthesis.getVoices().find(x=>/^es/i.test(x.lang));if(v)u.voice=v;
 u.rate=1.02;u.pitch=.95;
 u.onstart=()=>{SPEAKING=true;orbUpd()};
 u.onend=u.onerror=()=>{SPEAKING=false;orbUpd()};
 speechSynthesis.speak(u);
}
checkLvl();
render();
</script>
